services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - codegate_postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-codegate}
      - POSTGRES_USER=${POSTGRES_USER:-codegate}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-codegate} -d ${POSTGRES_DB:-codegate}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.codegate_backend
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg2://codegate:postgres@postgres:5432/codegate}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.codegate_backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg2://codegate:postgres@postgres:5432/codegate}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GITHUB_APP_ID=${GITHUB_APP_ID}
      - GITHUB_APP_INSTALLATION_ID=${GITHUB_APP_INSTALLATION_ID}
      - GITHUB_APP_PRIVATE_KEY_PATH=${GITHUB_APP_PRIVATE_KEY_PATH}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
      - SMEE_URL=${SMEE_URL}
    # Mount the secret file directly, if provided, rather than baking it into the image.
    volumes:
      - type: bind
        source: ./secrets/github-app.pem
        target: /run/secrets/github-app.pem
        read_only: true
        # Make the volume optional, so it doesn't crash if they don't have the key yet.
        bind:
          create_host_path: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/system/status')"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.codegate_frontend
      args:
        # Pass backend API URL for Vite build config
        - VITE_CODEGATE_API_URL=${VITE_CODEGATE_API_URL:-http://127.0.0.1:8000/api/v1}
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  codegate_postgres_data:
